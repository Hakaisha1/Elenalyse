<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elenalyse Live</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      user-select: none;
      cursor: grab;
    }
    body:active {
      cursor: grabbing;
    }
    #canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: transparent !important;
    }
  </style>
</head>
<body data-tauri-drag-region>
  <canvas id="canvas" data-tauri-drag-region></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
